<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2a1f17">

<meta name="apple-mobile-web-app-title" content="Gary">
<title>Gary — a tipsy 10M-param AI</title>
<style>
  :root { --bg:#1a1410; --panel:#2a1f17; --amber:#f2a93b; --foam:#fff3d6; --me:#3b6e8f; --dim:#a8937a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--foam); font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif; }
  body { display:flex; flex-direction:column; height:100dvh; }
  header { padding:calc(14px + env(safe-area-inset-top)) 16px 10px; background:linear-gradient(#3a2a1c,#2a1f17); border-bottom:2px solid #4a3522; display:flex; align-items:center; gap:12px; }
  .mug { font-size:34px; display:inline-block; animation:wobble 2.4s ease-in-out infinite; }
  @keyframes wobble { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }
  h1 { margin:0; font-size:20px; color:var(--amber); }
  .sub { font-size:12px; color:var(--dim); }
  #log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 13px; border-radius:16px; line-height:1.4; white-space:pre-wrap; word-wrap:break-word; font-size:16px; }
  .bot { background:var(--panel); border:1px solid #4a3522; align-self:flex-start; border-bottom-left-radius:4px; }
  .me { background:var(--me); align-self:flex-end; border-bottom-right-radius:4px; }
  .bot.typing::after { content:"▍"; animation:blink 1s infinite; color:var(--amber); }
  @keyframes blink { 50%{opacity:0} }
  .calc { display:inline-block; font-size:11px; color:var(--amber); margin-bottom:4px; opacity:.85; }
  #chips { display:flex; gap:8px; overflow-x:auto; padding:0 14px 8px; }
  .chip { flex:none; background:transparent; color:var(--amber); border:1px solid #6a4a2a; border-radius:999px; padding:6px 12px; font-size:13px; }
  form { display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:#221912; border-top:1px solid #3a2a1c; }
  input { flex:1; min-width:0; background:#120d0a; color:var(--foam); border:1px solid #4a3522; border-radius:999px; padding:12px 16px; font-size:16px; }
  button.send { background:var(--amber); color:#2a1a08; border:0; border-radius:999px; padding:0 18px; font-weight:700; font-size:16px; }
  button:disabled { opacity:.5; }
  #drunk { display:flex; align-items:center; gap:8px; padding:6px 14px; font-size:12px; color:var(--dim); }
  #drunk input { flex:1; padding:0; accent-color:var(--amber); }
</style>
</head>
<body>
<header>
  <span class="mug">🍺</span>
  <div><h1>Gary</h1><div class="sub" id="status">waking up gary…</div></div>
</header>
<div id="log"></div>
<div id="chips"></div>
<div id="drunk"><span>sober-ish</span><input type="range" id="temp" min="0.3" max="1.4" step="0.05" value="0.8"><span>wasted</span></div>
<form id="f"><input id="in" placeholder="say somethin to gary…" autocomplete="off" disabled><button class="send" id="go" disabled>Send</button></form>
<script>
const META = {"chars": "\n !'()*+,-./0123456789:=?abcdefghijklmnopqrstuvwxyz", "cfg": [51, 320, 8, 8, 192], "tensors": [["tok.weight", "q", [51, 320]], ["pos.weight", "q", [192, 320]], ["blocks.0.ln1.weight", "f", 320], ["blocks.0.ln1.bias", "f", 320], ["blocks.0.qkv.weight", "q", [960, 320]], ["blocks.0.qkv.bias", "f", 960], ["blocks.0.proj.weight", "q", [320, 320]], ["blocks.0.proj.bias", "f", 320], ["blocks.0.ln2.weight", "f", 320], ["blocks.0.ln2.bias", "f", 320], ["blocks.0.fc1.weight", "q", [1280, 320]], ["blocks.0.fc1.bias", "f", 1280], ["blocks.0.fc2.weight", "q", [320, 1280]], ["blocks.0.fc2.bias", "f", 320], ["blocks.1.ln1.weight", "f", 320], ["blocks.1.ln1.bias", "f", 320], ["blocks.1.qkv.weight", "q", [960, 320]], ["blocks.1.qkv.bias", "f", 960], ["blocks.1.proj.weight", "q", [320, 320]], ["blocks.1.proj.bias", "f", 320], ["blocks.1.ln2.weight", "f", 320], ["blocks.1.ln2.bias", "f", 320], ["blocks.1.fc1.weight", "q", [1280, 320]], ["blocks.1.fc1.bias", "f", 1280], ["blocks.1.fc2.weight", "q", [320, 1280]], ["blocks.1.fc2.bias", "f", 320], ["blocks.2.ln1.weight", "f", 320], ["blocks.2.ln1.bias", "f", 320], ["blocks.2.qkv.weight", "q", [960, 320]], ["blocks.2.qkv.bias", "f", 960], ["blocks.2.proj.weight", "q", [320, 320]], ["blocks.2.proj.bias", "f", 320], ["blocks.2.ln2.weight", "f", 320], ["blocks.2.ln2.bias", "f", 320], ["blocks.2.fc1.weight", "q", [1280, 320]], ["blocks.2.fc1.bias", "f", 1280], ["blocks.2.fc2.weight", "q", [320, 1280]], ["blocks.2.fc2.bias", "f", 320], ["blocks.3.ln1.weight", "f", 320], ["blocks.3.ln1.bias", "f", 320], ["blocks.3.qkv.weight", "q", [960, 320]], ["blocks.3.qkv.bias", "f", 960], ["blocks.3.proj.weight", "q", [320, 320]], ["blocks.3.proj.bias", "f", 320], ["blocks.3.ln2.weight", "f", 320], ["blocks.3.ln2.bias", "f", 320], ["blocks.3.fc1.weight", "q", [1280, 320]], ["blocks.3.fc1.bias", "f", 1280], ["blocks.3.fc2.weight", "q", [320, 1280]], ["blocks.3.fc2.bias", "f", 320], ["blocks.4.ln1.weight", "f", 320], ["blocks.4.ln1.bias", "f", 320], ["blocks.4.qkv.weight", "q", [960, 320]], ["blocks.4.qkv.bias", "f", 960], ["blocks.4.proj.weight", "q", [320, 320]], ["blocks.4.proj.bias", "f", 320], ["blocks.4.ln2.weight", "f", 320], ["blocks.4.ln2.bias", "f", 320], ["blocks.4.fc1.weight", "q", [1280, 320]], ["blocks.4.fc1.bias", "f", 1280], ["blocks.4.fc2.weight", "q", [320, 1280]], ["blocks.4.fc2.bias", "f", 320], ["blocks.5.ln1.weight", "f", 320], ["blocks.5.ln1.bias", "f", 320], ["blocks.5.qkv.weight", "q", [960, 320]], ["blocks.5.qkv.bias", "f", 960], ["blocks.5.proj.weight", "q", [320, 320]], ["blocks.5.proj.bias", "f", 320], ["blocks.5.ln2.weight", "f", 320], ["blocks.5.ln2.bias", "f", 320], ["blocks.5.fc1.weight", "q", [1280, 320]], ["blocks.5.fc1.bias", "f", 1280], ["blocks.5.fc2.weight", "q", [320, 1280]], ["blocks.5.fc2.bias", "f", 320], ["blocks.6.ln1.weight", "f", 320], ["blocks.6.ln1.bias", "f", 320], ["blocks.6.qkv.weight", "q", [960, 320]], ["blocks.6.qkv.bias", "f", 960], ["blocks.6.proj.weight", "q", [320, 320]], ["blocks.6.proj.bias", "f", 320], ["blocks.6.ln2.weight", "f", 320], ["blocks.6.ln2.bias", "f", 320], ["blocks.6.fc1.weight", "q", [1280, 320]], ["blocks.6.fc1.bias", "f", 1280], ["blocks.6.fc2.weight", "q", [320, 1280]], ["blocks.6.fc2.bias", "f", 320], ["blocks.7.ln1.weight", "f", 320], ["blocks.7.ln1.bias", "f", 320], ["blocks.7.qkv.weight", "q", [960, 320]], ["blocks.7.qkv.bias", "f", 960], ["blocks.7.proj.weight", "q", [320, 320]], ["blocks.7.proj.bias", "f", 320], ["blocks.7.ln2.weight", "f", 320], ["blocks.7.ln2.bias", "f", 320], ["blocks.7.fc1.weight", "q", [1280, 320]], ["blocks.7.fc1.bias", "f", 1280], ["blocks.7.fc2.weight", "q", [320, 1280]], ["blocks.7.fc2.bias", "f", 320], ["lnf.weight", "f", 320], ["lnf.bias", "f", 320]], "nparams": 9942080};
const [V, D, L, H, T] = META.cfg; const HD = D / H;
const CH = META.chars, stoi = {}; [...CH].forEach((c, i) => stoi[c] = i);
let P = {};

async function load() {
  const buf = new Uint8Array(await (await fetch("weights.bin")).arrayBuffer());
  let off = 0;
  for (const [name, kind, shape] of META.tensors) {
    if (kind === "f") { P[name] = new Float32Array(buf.slice(off, off + shape * 4).buffer); off += shape * 4; }
    else { const [r, c] = shape;
      const sc = new Float32Array(buf.slice(off, off + r * 4).buffer); off += r * 4;
      const q = new Int8Array(buf.slice(off, off + r * c).buffer); off += r * c;
      P[name] = { r, c, sc, q }; }
  }
}
// y[o] = sc[o] * sum_i q[o,i] x[i] + b[o]
function matvec(W, x, b, y) {
  const { r, c, sc, q } = W;
  for (let o = 0; o < r; o++) { let s = 0, base = o * c;
    for (let i = 0; i < c; i++) s += q[base + i] * x[i];
    y[o] = s * sc[o] + (b ? b[o] : 0); }
  return y;
}
function rowOf(W, i, out) { const { c, sc, q } = W, s = sc[i];
  for (let j = 0; j < c; j++) out[j] = q[i * c + j] * s; return out; }
function ln(x, w, b, out) { let m = 0; for (let i = 0; i < D; i++) m += x[i]; m /= D;
  let v = 0; for (let i = 0; i < D; i++) { const d = x[i] - m; v += d * d; } v = 1 / Math.sqrt(v / D + 1e-5);
  for (let i = 0; i < D; i++) out[i] = (x[i] - m) * v * w[i] + b[i]; return out; }
const gelu = x => 0.5 * x * (1 + Math.tanh(0.7978845608 * (x + 0.044715 * x * x * x)));

let K, Vc, pos;
const x = new Float32Array(D), h = new Float32Array(D), tmp = new Float32Array(D), qkv = new Float32Array(3 * D),
  att = new Float32Array(D), f1 = new Float32Array(4 * D), sc = new Float32Array(T), logits = new Float32Array(V);
function reset() { K = []; Vc = []; for (let l = 0; l < L; l++) { K.push(new Float32Array(T * D)); Vc.push(new Float32Array(T * D)); } pos = 0; }

function step(tok) { // returns logits
  rowOf(P["tok.weight"], tok, x); rowOf(P["pos.weight"], pos, tmp);
  for (let i = 0; i < D; i++) x[i] += tmp[i];
  for (let l = 0; l < L; l++) {
    const p = "blocks." + l + ".";
    ln(x, P[p + "ln1.weight"], P[p + "ln1.bias"], h);
    matvec(P[p + "qkv.weight"], h, P[p + "qkv.bias"], qkv);
    K[l].set(qkv.subarray(D, 2 * D), pos * D); Vc[l].set(qkv.subarray(2 * D), pos * D);
    const s = 1 / Math.sqrt(HD);
    for (let hh = 0; hh < H; hh++) { const o = hh * HD; let mx = -1e9;
      for (let t = 0; t <= pos; t++) { let d = 0; const kb = t * D + o;
        for (let i = 0; i < HD; i++) d += qkv[o + i] * K[l][kb + i];
        sc[t] = d * s; if (sc[t] > mx) mx = sc[t]; }
      let sum = 0; for (let t = 0; t <= pos; t++) { sc[t] = Math.exp(sc[t] - mx); sum += sc[t]; }
      for (let i = 0; i < HD; i++) att[o + i] = 0;
      for (let t = 0; t <= pos; t++) { const w = sc[t] / sum, vb = t * D + o;
        for (let i = 0; i < HD; i++) att[o + i] += w * Vc[l][vb + i]; } }
    matvec(P[p + "proj.weight"], att, P[p + "proj.bias"], tmp);
    for (let i = 0; i < D; i++) x[i] += tmp[i];
    ln(x, P[p + "ln2.weight"], P[p + "ln2.bias"], h);
    matvec(P[p + "fc1.weight"], h, P[p + "fc1.bias"], f1);
    for (let i = 0; i < 4 * D; i++) f1[i] = gelu(f1[i]);
    matvec(P[p + "fc2.weight"], f1, P[p + "fc2.bias"], tmp);
    for (let i = 0; i < D; i++) x[i] += tmp[i];
  }
  ln(x, P["lnf.weight"], P["lnf.bias"], h);
  matvec(P["tok.weight"], h, null, logits);
  pos++; return logits;
}
function sample(lg, temp) {
  const idx = [...lg.keys()].sort((a, b) => lg[b] - lg[a]).slice(0, 20);
  const mx = lg[idx[0]]; const pr = idx.map(i => Math.exp((lg[i] - mx) / temp));
  let r = Math.random() * pr.reduce((a, b) => a + b), k = 0; while ((r -= pr[k]) > 0 && k < pr.length - 1) k++;
  return idx[k];
}

// ---------- calculator (gary's secret sober friend) ----------
function findMath(s) {
  let e = s.toLowerCase().replace(/divided by|over/g, "/").replace(/times|multiplied by|\bx\b|×/g, "*")
    .replace(/plus|added to/g, "+").replace(/minus|take away/g, "-").replace(/to the power of|\^/g, "^").replace(/÷/g, "/")
    .replace(/squared/g, "^2").replace(/,(?=\d{3})/g, "");
  const m = e.match(/[-(]*\s*\d*\.?\d+(?:\s*[-+*/^%]\s*[-(]*\s*\d*\.?\d+\s*\)*)+|sqrt\s*\(?\s*\d*\.?\d+\s*\)?/);
  if (!m) return null;
  const expr = m[0].trim();
  try { const v = evalExpr(expr); if (!isFinite(v)) return { expr, ans: "infinity, man. you can't divide by zero. the universe shays no." };
    return { expr, ans: String(Math.round(v * 1e6) / 1e6) }; } catch (e) { return null; }
}
function evalExpr(s) {
  const toks = s.match(/sqrt|\d*\.?\d+|[-+*/^%()]/g); let i = 0;
  const peek = () => toks[i], eat = () => toks[i++];
  function prim() { let t = eat();
    if (t === "-") return -prim(); if (t === "sqrt") { const v = prim(); return Math.sqrt(v); }
    if (t === "(") { const v = add(); if (peek() === ")") eat(); return v; } const n = parseFloat(t); if (isNaN(n)) throw 0; return n; }
  function pow() { let b = prim(); if (peek() === "^") { eat(); return Math.pow(b, pow()); } return b; }
  function mul() { let v = pow(); while ("*/%".includes(peek()) && peek()) { const o = eat(), r = pow(); v = o === "*" ? v * r : o === "/" ? v / r : v % r; } return v; }
  function add() { let v = mul(); while ((peek() === "+" || peek() === "-")) { const o = eat(), r = mul(); v = o === "+" ? v + r : v - r; } return v; }
  const v = add(); if (i < toks.length) throw 0; return v;
}
const say = e => e.replace(/\*/g, " times ").replace(/\//g, " divided by ").replace(/\+/g, " plus ").replace(/\^/g, " to the power of ")
  .replace(/(\d)\s*-\s*(\d)/g, "$1 minus $2").replace(/%/g, " mod ").replace(/[()]/g, "").replace(/\s+/g, " ").trim();
const pick = a => a[Math.floor(Math.random() * a.length)];

// ---------- chat ----------
const log = document.getElementById("log"), inp = document.getElementById("in"), go = document.getElementById("go");
function bubble(cls, txt) { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = txt; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
const clean = s => [...s.toLowerCase()].filter(c => c in stoi && c !== "\n").join("").slice(0, 80);
let busy = false;
async function reply(user) {
  busy = true; go.disabled = true;
  const m = findMath(user);
  let forced = "";
  if (m) forced = pick(["okay okay, math time.", "ooh numbersh!", "math! i love math.", "eashy peashy.", "shhh shhh i'm thinkin."]) + " " + clean(say(m.expr)) + "... thash " + clean(m.ans) + ". ";
  const prompt = "u: " + clean(user) + "\nb: " + forced;
  const d = bubble("bot typing", "");
  if (m) { const tag = document.createElement("div"); tag.className = "calc"; tag.textContent = "🧮 calculator says " + m.ans; d.appendChild(tag); }
  const out = document.createTextNode(forced); d.appendChild(out);
  reset(); let lg; const hist = [];
  for (const c of prompt) { hist.push(stoi[c]); lg = step(stoi[c]); }
  const temp = parseFloat(document.getElementById("temp").value);
  let gen = "", last = "";
  while (gen.length < 700) {
    if (pos >= T) { reset(); const keep = hist.slice(-120); for (let j = 0; j < keep.length - 1; j++) step(keep[j]); hist.length = 0; hist.push(...keep); lg = step(keep[keep.length - 1]); await new Promise(r => setTimeout(r, 0)); }
    const id = sample(lg, temp), c = CH[id]; hist.push(id);
    if (c === "\n" && last === "\n") break;
    if (gen.endsWith("\nu") ) { gen = gen.slice(0, -2); break; }
    gen += c; last = c; out.textContent = forced + gen;
    log.scrollTop = log.scrollHeight;
    lg = step(id);
    if (gen.length % 3 === 0) await new Promise(r => setTimeout(r, 0));
  }
  out.textContent = (forced + gen).replace(/\nu:?$/, "").trim();
  d.classList.remove("typing"); busy = false; go.disabled = false; inp.focus();
}
document.getElementById("f").onsubmit = e => { e.preventDefault(); const t = inp.value.trim(); if (!t || busy) return; inp.value = ""; bubble("me", t); reply(t); };
["hi gary", "what is 47 * 23", "write a poem about pizza", "tell me a story about a pirate", "give me advice about school", "tell me a joke", "are you drunk"]
  .forEach(t => { const b = document.createElement("button"); b.className = "chip"; b.textContent = t;
    b.onclick = () => { if (busy) return; bubble("me", t); reply(t); }; document.getElementById("chips").appendChild(b); });
setTimeout(async () => { try { await load(); } catch (e) { document.getElementById("status").textContent = "couldn't load gary's brain. check your connection and reopen."; return; } document.getElementById("status").textContent = (META.nparams / 1e6).toFixed(1) + "M params · runs on your phone, offline";
  inp.disabled = false; go.disabled = false; bubble("bot", "heyyy! i'm gary. *hic* i do math, poemsh, shtories, and terrible advice. whatcha need?"); }, 50);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
